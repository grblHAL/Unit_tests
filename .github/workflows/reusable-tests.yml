name: Reusable host tests
on:
  workflow_call:
    inputs:
      harness_repository:
        type: string
        required: true
      harness_ref:
        type: string
        required: true
      suite:
        type: string
        required: false
        default: 'core'
      source_repository:
        type: string
        required: false
        default: ''
      source_ref:
        type: string
        required: false
        default: ''
      source_pr:
        type: string
        required: false
        default: ''
      source_base_ref:
        type: string
        required: false
        default: ''
      source_base_repository:
        type: string
        required: false
        default: ''
      core_ref:
        type: string
        required: false
        default: ''
      run_label:
        type: string
        required: false
        default: 'core'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      harness_sha: ${{ steps.harness.outputs.sha }}
      coverage_filter: ${{ steps.resolve.outputs.coverage_filter }}
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ inputs.harness_ref }}
          persist-credentials: false
      - name: Record harness revision
        id: harness
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test CI helpers
        run: python scripts/report_stage.py --job source --stage helpers -- python -m unittest discover -s scripts -p 'test_*.py'
      - name: Resolve source revisions once
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_SHA: ${{ steps.harness.outputs.sha }}
          HARNESS_REPOSITORY: ${{ inputs.harness_repository }}
          SUITE: ${{ inputs.suite }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_PR: ${{ inputs.source_pr }}
          CORE_REF: ${{ inputs.core_ref }}
          SOURCE_BASE_REF: ${{ inputs.source_base_ref }}
          SOURCE_BASE_REPOSITORY: ${{ inputs.source_base_repository }}
        run: python scripts/report_stage.py --job source --stage resolve -- python scripts/resolve_source.py --suite "$SUITE" --repository "$SOURCE_REPOSITORY" --ref "$SOURCE_REF" --pr "$SOURCE_PR" --core-ref "$CORE_REF" --source-base-ref "$SOURCE_BASE_REF" --source-base-repository "$SOURCE_BASE_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: source-lock-${{ inputs.run_label }}
          path: source-lock.json
      - name: Collect source diagnostics
        if: always()
        run: python scripts/ci_report.py --job source
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ inputs.run_label }}-source
          path: |
            report-source.json
            source-lock.json
            logs/
  test:
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ needs.source.outputs.harness_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: source-lock-${{ inputs.run_label }}
      - name: Fetch locked sources
        run: python scripts/report_stage.py --job "${{ matrix.compiler }}" --stage fetch -- python scripts/prepare_sources.py
      - name: Configure
        env:
          COMPILER: ${{ matrix.compiler }}
        run: python scripts/report_stage.py --job "$COMPILER" --stage configure -- python scripts/configure_suite.py --mode sanitizers --compiler "$COMPILER"
      - name: Build
        run: python scripts/report_stage.py --job "${{ matrix.compiler }}" --stage build -- cmake --build build --parallel 2
      - name: Test
        run: python scripts/report_stage.py --job "${{ matrix.compiler }}" --stage test -- python scripts/run_suite.py test
      - name: Classify individual results and sanitizer diagnostics
        if: always()
        run: python scripts/report_stage.py --job "${{ matrix.compiler }}" --stage classify -- python scripts/run_suite.py summary
      - name: Collect concise test diagnostics
        if: always()
        run: python scripts/ci_report.py --job "${{ matrix.compiler }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ inputs.run_label }}-${{ matrix.compiler }}
          path: |
            report-*.json
            source-lock.json
            logs/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ inputs.run_label }}-${{ matrix.compiler }}
          path: |
            source-lock.json
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/known-crash-*.log
  coverage:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ needs.source.outputs.harness_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: source-lock-${{ inputs.run_label }}
      - name: Fetch locked sources
        run: python scripts/report_stage.py --job coverage --stage fetch -- python scripts/prepare_sources.py
      - run: python scripts/report_stage.py --job coverage --stage tooling -- pip install gcovr==8.4
      - run: python scripts/report_stage.py --job coverage --stage configure -- python scripts/configure_suite.py --mode coverage --compiler gcc
      - id: coverage_build
        run: python scripts/report_stage.py --job coverage --stage build -- cmake --build build --parallel 2
      - id: coverage_tests
        run: python scripts/report_stage.py --job coverage --stage test -- python scripts/run_suite.py test
      - name: Classify coverage test results
        id: coverage_classify
        if: always()
        run: python scripts/report_stage.py --job coverage --stage classify -- python scripts/run_suite.py summary
      - name: Report coverage
        id: coverage_report
        if: always() && !cancelled() && steps.coverage_build.outcome == 'success'
        env:
          COVERAGE_TITLE: ${{ steps.coverage_tests.outcome == 'success' && steps.coverage_classify.outcome == 'success' && 'Core coverage' || 'Partial core coverage - tests failed' }}
          COVERAGE_FILTER: ${{ needs.source.outputs.coverage_filter }}
        run: python scripts/report_stage.py --job coverage --stage coverage -- gcovr --merge-mode-functions=separate --root . --filter "$COVERAGE_FILTER" --html-details coverage.html --html-title "$COVERAGE_TITLE" --xml coverage.xml --print-summary
      - name: Collect concise coverage diagnostics
        if: always()
        run: python scripts/ci_report.py --job coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ inputs.run_label }}-coverage
          path: |
            report-coverage.json
            source-lock.json
            logs/
      - name: Summarize collected coverage
        if: always() && !cancelled() && steps.coverage_report.outcome == 'success'
        env:
          COVERAGE_COMPLETE: ${{ steps.coverage_tests.outcome == 'success' && steps.coverage_classify.outcome == 'success' }}
        run: python scripts/run_suite.py coverage-summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ inputs.run_label }}
          path: |
            source-lock.json
            coverage*
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/known-crash-*.log
  diagnosis:
    name: CI diagnosis
    if: always()
    needs: [source, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        id: report_checkout
        with:
          repository: ${{ inputs.harness_repository }}
          ref: ${{ needs.source.outputs.harness_sha || inputs.harness_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: report-${{ inputs.run_label }}-*
          path: reports
      - name: Restore tested source record
        run: |
          python -c "from pathlib import Path; import shutil; records=list(Path('reports').rglob('source-lock.json')); shutil.copyfile(records[0], 'source-lock.json') if records else None"
      - name: Report harness checkout failure
        if: always() && steps.report_checkout.outcome == 'failure'
        run: |
          echo "## Why this run failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The test harness could not be checked out. Verify harness repository/ref and access; tests and diagnostic collection could not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Why this run failed
        if: always() && steps.report_checkout.outcome == 'success'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci_report.py --aggregate
