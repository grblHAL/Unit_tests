name: Core tests
run-name: >-
  Core tests: ${{ inputs.source_repository || 'grblHAL/core' }} @ ${{ inputs.source_pr && format('PR #{0}', inputs.source_pr) || inputs.source_ref || 'master' }}
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Core owner/repo or GitHub URL (blank = grblHAL/core)'
        type: string
        default: ''
      source_ref:
        description: 'Branch, tag or SHA (blank = upstream master)'
        type: string
        default: ''
      source_base_ref:
        description: 'Optional comparison base branch, tag or SHA for changed-code coverage'
        type: string
        default: ''
      source_base_repository:
        description: 'Optional base repository (blank = selected source repository)'
        type: string
        default: ''
      source_pr:
        description: 'PR number; leave source_ref blank'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  core:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      harness_repository: ${{ github.repository }}
      harness_ref: ${{ github.sha }}
      source_repository: ${{ inputs.source_repository || '' }}
      source_ref: ${{ inputs.source_ref || '' }}
      source_pr: ${{ inputs.source_pr || '' }}
      source_base_ref: ${{ inputs.source_base_ref || '' }}
      source_base_repository: ${{ inputs.source_base_repository || '' }}
