name: Plugin tests
run-name: >-
  Plugin tests: ${{ inputs.suite }} @ ${{ inputs.source_pr && format('PR #{0}', inputs.source_pr) || inputs.source_ref || 'suite default' }} | CORE ${{ inputs.core_ref || 'default' }}
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Registered suite
        type: choice
        options: [plugins_misc, plugin_eeprom, plugin_fans, plugin_openpnp, plugin_odometer, plugin_encoder, plugin_spindle_vfd, plugin_spindle_onoff, plugin_spindle_pwm, plugin_spindle_select, plugin_spindle_offset, plugin_spindle_clone, plugin_sdcard_stream, plugin_keypad, plugin_networking, plugin_laser_ppi, plugin_laser_cluster, plugin_trinamic, plugin_plasma, plugin_bluetooth, plugin_embroidery_readers, plugin_auxp, plugin_interlock, plugin_pneumaseal, plugin_thermistor, plugin_virtual_inputs, plugin_homingaccel, plugin_rgb_sienci, plugin_flexgpio, plugin_atci, plugin_mpg_transport, plugin_webui]
        default: plugins_misc
      source_repository:
        description: 'Source owner/repo or GitHub URL (blank = suite default)'
        type: string
        default: ''
      source_ref:
        description: 'Branch, tag or SHA (blank = default branch)'
        type: string
        default: ''
      source_pr:
        description: 'PR number; leave source_ref blank'
        type: string
        default: ''
      core_ref:
        description: 'Core branch, tag or SHA (blank = core default)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      harness_repository: ${{ github.repository }}
      harness_ref: ${{ github.sha }}
      suite: ${{ inputs.suite }}
      run_label: ${{ inputs.suite }}
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      source_pr: ${{ inputs.source_pr }}
      core_ref: ${{ inputs.core_ref }}
