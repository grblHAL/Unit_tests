name: Driver tests
run-name: >-
  Driver tests: ${{ inputs.suite }} @ ${{ inputs.source_pr && format('PR #{0}', inputs.source_pr) || inputs.source_ref || 'suite default' }} | CORE ${{ inputs.core_ref || 'default' }}
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Registered suite
        type: choice
        options: [driver_simulator, driver_simulator_vfs, driver_rp2040_flash, driver_esp32_nvs, driver_stm32f4_flash, driver_stm32f4_serial, driver_stm32f7_flash, driver_stm32f7_serial, driver_lpc176x_flash, driver_stm32h7_flash, driver_stm32f1_flash, driver_stm32f1_serial, driver_stm32f3_flash, driver_stm32f3_serial, driver_imxrt1062_pwm, driver_sam3x8e_serial, driver_tm4c123_eeprom, driver_ti_shared_eeprom, driver_tm4c123_serial, driver_msp432p_serial, driver_psoc5_serial_reference, driver_ti_shared_serial_reference]
        default: driver_simulator
      source_repository:
        description: 'Source owner/repo or GitHub URL (blank = suite default)'
        type: string
        default: ''
      source_ref:
        description: 'Branch, tag or SHA (blank = default branch)'
        type: string
        default: ''
      source_pr:
        description: 'PR number; leave source_ref blank'
        type: string
        default: ''
      core_ref:
        description: 'Core ref (blank = suite default; fixed legacy reference suites reject overrides)'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      harness_repository: ${{ github.repository }}
      harness_ref: ${{ github.sha }}
      suite: ${{ inputs.suite }}
      run_label: ${{ inputs.suite }}
      source_repository: ${{ inputs.source_repository }}
      source_ref: ${{ inputs.source_ref }}
      source_pr: ${{ inputs.source_pr }}
      core_ref: ${{ inputs.core_ref }}
