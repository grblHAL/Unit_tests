# Add as .github/workflows/host-tests.yml in the core repository.
# Both harness refs must match; use upstream master or a reviewed release tag
# or the same reviewed commit SHA before making this a required check.
name: Core host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    uses: grblHAL/Unit_tests/.github/workflows/reusable-tests.yml@master
    with:
      harness_repository: grblHAL/Unit_tests
      harness_ref: master
      suite: core
      source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      source_ref: ${{ github.event.pull_request.head.sha || github.sha }}
